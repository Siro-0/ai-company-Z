<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自律型AI企業コア</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">LOCAL-FIRST / NO API</p>
      <h1>自律型AI企業コア</h1>
      <p class="muted">ルールベースの試作版。外部通信なしで動作します。</p>
    </div>
    <button id="runBtn">1サイクル実行</button>
  </header>

  <section class="stats" aria-label="会社の状態">
    <article><span>保留中タスク</span><strong id="pendingCount">0</strong></article>
    <article><span>完了タスク</span><strong id="doneCount">0</strong></article>
    <article><span>実行サイクル</span><strong id="cycleCount">0</strong></article>
  </section>

  <section class="panel">
    <h2>会社へのアイデア・指示</h2>
    <form id="ideaForm">
      <label for="ideaInput">やってほしいこと</label>
      <div class="formrow">
        <input id="ideaInput" maxlength="240" placeholder="例：小さなデジタル商品案を3つ考える" required>
        <button type="submit">登録</button>
      </div>
    </form>
    <p class="hint">登録した内容はタスクとして保存され、次のサイクルで部署が処理します。</p>
  </section>

  <section class="panel">
    <div class="sectionhead"><h2>タスク一覧</h2><button class="quiet" id="exportBtn">データを書き出す</button></div>
    <div id="tasks" class="tasks"></div>
  </section>

  <section class="panel">
    <h2>実行ログ</h2>
    <ol id="logs" class="logs"></ol>
  </section>
  <footer><button class="quiet danger" id="resetBtn">すべて初期化</button><span class="muted">データはこのブラウザー内に保存されます。</span></footer>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
